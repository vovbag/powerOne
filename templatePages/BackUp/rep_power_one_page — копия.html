		  <select id="xparam1" class="form-select" name="xparam1" >
			<option selected="{{id_comp | raw}}">{{comp_name | raw}}</option>
			<optgroup label="Мои">
			{% for comp in companies1 %}
			  <option value="{{comp.id | raw}}">{{comp.name | raw}}</option>
			{% endfor %}
			</optgroup>
			<optgroup label="Опубликованные">
			  {% for comp in companies2 %}
			  <option value="{{comp.id | raw}}">{{comp.name | raw}}</option>
			 {% endfor %}
			</optgroup>
		  </select>

		  </select>

		  </select>

		 </div>

			<button class="btn btn-secondary  btn-label-primary me-2 waves-effect waves-light"  type="button" onClick="getContent('#id-table-content'); return false;">

		 <div class="mb-3 row" style="min-height: 300px; min-width:120px;" id="id-table-content" pro-id="{{id|raw}}" pro-url="/api/v1/htm/pro/rep/analyze/page/content">
		 
		 </div>

	</div>

	  <!--/ DataTable with Buttons -->

<script>
	//start after load page--
  $(function() {
	getContent('#id-table-content');
	
	$( "#xparam1" ).on( "change",   function() {
	  getSelect('#xparam1');
	});

  });

  
 function getContent(a){
	var frm = $(a);
	
	if(frm){
		frm.block({
			message:
			  '<div class="sk-wave mx-auto"><div class="sk-rect sk-wave-rect"></div> <div class="sk-rect sk-wave-rect"></div> <div class="sk-rect sk-wave-rect"></div> <div class="sk-rect sk-wave-rect"></div> <div class="sk-rect sk-wave-rect"></div></div>',
			timeout: 0,
			css: {
			  backgroundColor: 'transparent',
			  border: '0'
			},
			overlayCSS: {
			  opacity: 0.25
			}
		  });
		var sid = frm.attr('pro-id');
		var url = frm.attr('pro-url');
		
		var $arInptVal = {};
	
		$('select').each(function() {
			if (this.name !=''){
				$arInptVal[this.name] = $(this).val();
			}
		});
		//console.log(sid);
		
		$.ajax({
			url:  url,//+'/'+sid,
			method: 'post',
			dataType: 'html',
			data: $arInptVal,
			success: function(data){
				if (data.length >150 ){
					frm.empty();
					frm.append(data);

				} else { //console.log(data.Error); 
					toastr.options = {"timeOut": 0, "extendedTimeOut": 0};
					toastr.warning(data.Error+'<br /><br />	<button type="button" class="btn btn-label-warning">Закрыть</button>', 'Ошибка '+data.code.toString()+'!' );
					toastr.options = { "timeOut": 5000, "extendedTimeOut": 1000 };
				}
				frm.unblock();
			},
				error: function (jqXHR, exception) {errorHook (jqXHR, exception);}
		});
			
	
	}
	return false;
 }
 
 
 function getSelect(a){
	var frm = $(a);

	if(frm){
		var sid = frm.find(":selected").val();
		var url = "/api/v1/htm/pro/rep/powerone/page/variant";
		$('#id-table-content').attr('pro-id', sid);
		var frm1 = $('#id-select-content');
		
		frm1.block({
			message: '<div class="spinner-border text-primary" role="status"></div>',
			timeout: 0,
			css: {
			  backgroundColor: 'transparent',
			  border: '0'
			},
			overlayCSS: {
			  backgroundColor: '#fff',
			  opacity: 0.8
			}
		});
		
		$.ajax({
			url:  url+'/'+sid,
			method: 'get',
			dataType: 'html',
			//data: {zuid: vl_sGuid},
			success: function(data){
				if (data.length >150 ){
					//console.log(data);
					arr = $.parseJSON(data);
					
					$('#xparam2').empty().append(function() {
						var output = '';
						$.each(arr[0].profit, function(key, value) {
							output += '<option value='+value.id+'>' + value.name + '</option>';
						});
						return output;
					});
					
					$('#xparam3').empty().append(function() {
						var output = '';
						$.each(arr[0].balance, function(key, value) {
							output += '<option value='+value.id+'>' + value.name + '</option>';
						});
						return output;
					});
					
					if (arr[0].profit.length>0 && arr[0].balance.length>0){
						
						getContent('#id-table-content');
					}

				} else { //console.log(data.Error); 
					toastr.options = {"timeOut": 0, "extendedTimeOut": 0};
					toastr.warning(data.Error+'<br /><br />	<button type="button" class="btn btn-label-warning">Закрыть</button>', 'Ошибка '+data.code.toString()+'!' );
					toastr.options = { "timeOut": 5000, "extendedTimeOut": 1000 };
				}
				frm1.unblock();
			},
				error: function (jqXHR, exception) {errorHook (jqXHR, exception);}
		});
			
	
	}
	return false;
 }

  function afterSaveMainForm(sid){
	var a = $('#add-new-record');
	if(a){a.removeClass('show');}
	getContent('#id-table-content');
  }
</script>
