<script>
	//start after load page--
	$(function() {
		getTable('#id-table-content');
	});

  
 function getTable(a){
	var frm = $(a);
	
	if(frm){
		frm.block({
			message:
			  '<div class="sk-wave mx-auto"><div class="sk-rect sk-wave-rect"></div> <div class="sk-rect sk-wave-rect"></div> <div class="sk-rect sk-wave-rect"></div> <div class="sk-rect sk-wave-rect"></div> <div class="sk-rect sk-wave-rect"></div></div>',
			timeout: 0,
			css: {
			  backgroundColor: 'transparent',
			  border: '0'
			},
			overlayCSS: {
			  opacity: 0.5
			}
		  });
		var sid = frm.attr('pro-id');
		var url = frm.attr('pro-url');
		//console.log(sid);
		
		$.ajax({
			url:  url+'/'+sid,
			method: 'get',
			dataType: 'html',
			//data: {zuid: vl_sGuid},
			success: function(data){
				if (data.length >150 ){
					frm.empty();
					frm.append(data);

				} else { //console.log(data.Error); 
					toastr.options = {"timeOut": 0, "extendedTimeOut": 0};
					toastr.warning(data.Error+'<br /><br />	<button type="button" class="btn btn-label-warning">Закрыть</button>', 'Ошибка '+data.code.toString()+'!' );
					toastr.options = { "timeOut": 5000, "extendedTimeOut": 1000 };
				}
				frm.unblock();
			},
				error: function (jqXHR, exception) {errorHook (jqXHR, exception);}
		});
			
	
	}
	return false;
 }
 
 function setProData(sid){
	var frm = $('#add-new-record');
	console.log('setProData');
	if(frm){
		frm.attr('pro-id', sid);
		frm.attr('pro-url', '/api/v1/htm/pro/spr/rawdata/page/variantFormUpload');
		//frm.modal('show');
		//frm.addClass('show');
		//if(a){a.removeClass('show');}
		$('#add-new-record-button').trigger('click');
		//new bootstrap.Modal(frm).show();
	}
  }
  
  function setProDataEdit(sid){
	var frm = $('#add-new-record');
	console.log('qq');
	if(frm){
		frm.attr('pro-id', sid);
		frm.attr('pro-url', '/api/v1/htm/pro/spr/rawdata/page/variantFormEdit');
		$('#add-new-record-button').trigger('click');
		//frm.addClass('show');
	}
  }

  function afterSaveMainForm(sid){
	var a = $('#add-new-record');
	if(a){a.removeClass('show');}
	getTable('#id-table-content');
  }
</script>
